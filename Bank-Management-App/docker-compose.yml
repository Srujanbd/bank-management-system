services:

  db:
    image: postgres:16
    container_name: bank-db
    environment:
      POSTGRES_DB: bank_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bank-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: bank_management
      DB_USERNAME: postgres
      DB_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: